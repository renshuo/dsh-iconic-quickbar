# dsh-iconic-quickbar — bundle patch
#
# Declares the bundle row so the Client half (client.js) is loaded. All work
# happens there: the sidebar's own panel list is restyled into one horizontal,
# text-less icon row, with a mode switch at its right edge.
#
# Nothing is hidden by disabling a plugin: the native rows keep their plugins,
# their centre panels and their aria-labels, and panels the row does not carry
# stay reachable from the list's own More menu.
- insert:
    - id: dsh-iconic-quickbar
      name: '@local/dsh-iconic-quickbar'
